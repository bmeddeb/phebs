# phebs configuration - exhaustive annotated reference (T1.1).
# phebs' own YAML configuration schema.
# This file passes strict config parsing as written. Connector URLs, selectors,
# paths, and identities are illustrative and must be replaced before use.
# Optional integrations use empty values, while commented examples show how to
# enable them. Unknown keys fail validation.
# ${ENV} expansion is supported only by documented secret fields; every
# referenced variable must exist and be non-empty.
# Secret-capable fields are auth.api_key, auth.bootstrap_user.password,
# auth.oidc.client_secret, webhook.secret, connections[].token,
# connections[].app.private_key, and connections[].http_auth username/password.

server:
  # Listen address. Default "127.0.0.1:3070". Expose phebs only through a
  # trusted TLS reverse proxy unless this is an isolated development host.
  addr: "127.0.0.1:3070"
  # All state lives here: shards at <data_dir>/index, bare repos at
  # <data_dir>/repos/<host>/<path>.git, supervised DB at <data_dir>/db
  # (including users, API-key hashes, and sessions).
  # Default "~/.phebs". `~` is expanded and the result must be an absolute,
  # literal path without glob metacharacters (*, ?, [, or backslash).
  data_dir: "~/.phebs"
  # Hardening response headers (X-Content-Type-Options, X-Frame-Options,
  # Referrer-Policy, and a conservative Content-Security-Policy) on every HTTP
  # response. Default true. Set false only when a reverse proxy or other
  # operator tooling manages these headers instead.
  security_headers: true

auth:
  # Migration only: imports this legacy bearer as a SHA-256 hash into the
  # database. Sign in, create a named/revocable key under Settings, migrate
  # clients, then remove api_key; omission deletes the legacy DB key.
  api_key: ""
  # api_key: "${PHEBS_LEGACY_API_KEY}"

  # Session cookies are Secure by default. Keep true behind HTTPS. Set false
  # only for deliberate plain-HTTP local development such as localhost:3070.
  cookie_secure: true
  # Absolute session lifetime (default 12h, accepted range 15m..720h).
  # Sessions also have a fixed 30-minute idle timeout.
  session_lifetime: 12h

  # Optional CIDRs for every trusted reverse-proxy hop, including the direct
  # peer. Phebs then walks X-Forwarded-For for per-client login limits. Leave
  # empty when reached directly. Values must be exact CIDRs without surrounding
  # whitespace. Never configure client networks here.
  trusted_proxies: []
  # trusted_proxies: ["127.0.0.1/32", "10.0.0.10/32"]

  # Optional one-time first administrator. All-empty keeps it disabled. The
  # password is Argon2id-hashed and must be 12..1024 bytes when configured;
  # remove this block after first startup because changing it does not rotate
  # the stored password. Without bootstrap_user or OIDC, startup logs an
  # ephemeral setup token for the browser's first-run form.
  bootstrap_user:
    email: ""
    display_name: ""
    password: ""
    # email: admin@example.com
    # display_name: Phebs Admin
    # password: "${PHEBS_BOOTSTRAP_PASSWORD}"

  # Optional single OpenID Connect provider. All-empty keeps it disabled.
  # Discovery runs at startup; openid/profile/email are always requested,
  # with these additional scopes.
  # The provider must return a verified email. URLs must be absolute and omit
  # credentials, query, and fragment. HTTPS is required except for loopback
  # tests. Each extra scope is one non-whitespace token.
  oidc:
    issuer_url: ""
    client_id: ""
    client_secret: ""
    redirect_url: ""
    scopes: []
    # issuer_url: https://idp.example.com
    # client_id: phebs
    # client_secret: "${PHEBS_OIDC_CLIENT_SECRET}"
    # redirect_url: https://phebs.example.com/api/auth/oidc/callback
    # scopes: [groups]

sync:
  # Delete repo rows and mirrors that no connection claims (default off).
  cleanup_orphans: false
  # Job-runner poll cadence (Go duration, default 15s). Lower it when
  # watch mode should feel instant.
  poll_interval: 15s
  # Re-sync cadence for remote connections (T7.5). Default 1h; "0" disables.
  resync_interval: 1h

# Index-builder diagnostics. Disabled by default because a large repository
# may produce substantial child output. When enabled, parent phases and the
# zoekt-git-index child's stdout/stderr are written to the phebs log with
# repository prefixes and bounded line chunks. Restart to apply.
indexing:
  verbose: false

# Bounded source-free pipeline receipts. Each component is independently
# opt-in and restart-bound. extractor_details requires extraction.
diagnostics:
  jobs: false
  candidates: false
  extraction: false
  extractor_details: false

# Push webhooks (T7.4). Empty leaves POST /api/webhook disabled.
webhook:
  # Verifies X-Hub-Signature-256 payload signatures (GitHub and Gitea).
  secret: ""
  # secret: "${WEBHOOK_SECRET}"

# Audit log (T10.1). Recording is always on; retention prunes old events
# twice a day (default 2160h = 90 days, "0" keeps forever).
audit:
  retention: 2160h

# Local usage analytics (T10.2). Zero telemetry: events exist only in the
# local DB and feed #/analytics. Default 8760h = 365 days, "0" keeps forever.
analytics:
  retention: 8760h

# Immutable proof bundles are unbounded by default. Set a positive Go
# duration to expire them after their latest successful materialization.
# Bundle bytes/content IDs never include this lifecycle metadata.
proof_bundles:
  retention: "0"

# Owner-separated bounded lifecycle is enabled by default. False disables
# automated age/count/byte and pressure collection, but hard-watermark safety
# admission, live roots, proof pins, active leases, tombstones,
# and proof_bundles.retention remain in force.
lifecycle:
  enabled: true

# Validation-gated work. Keep disabled in production. The provisional proto
# reader has exact source provenance, but T11.1 is STOP/not established and it
# does not yet have canonical descriptor/module lineage (T12.3).
experimental:
  provisional_proto_extraction: false
  # T19 Thrift declaration reader (thrift-contract). Same provisional
  # repo/path lineage posture; rule validation is the T19.1 spike.
  provisional_thrift_extraction: false
  # T22 thriftrw + Apache Thrift field-reference reader over a committed root
  # index.scip. Independent dark flag; each generator keeps its honest tier.
  provisional_thrift_field_extraction: false
  # T23 Kafka topic-evidence packs (kafka-producer, kafka-consumer). Same
  # provisional repo/path lineage posture; rule validation is the T23.1
  # spike, and the packs are abstention-dominant by design.
  provisional_kafka_extraction: false

# Permission-aware search (T10.3). PRESENCE of this block turns enforcement
# on: non-administrators then see only public repos, repos their mapped
# code-host identities grant, and always_visible matches — across search,
# file/history/code-nav reads, listings, and MCP. Identities are
# "<host>:<login>" where <host> is the repo-name prefix that host produces.
# ACLs mirror during sync (private repos only), so enable this, then re-sync.
# permissions:
#   users:
#     ben@meddeb.me: ["github.com:bmeddeb", "gitea.example.com:ben"]
#   always_visible: ["local/*"]  # repos with no ACL source (type git)
# User keys must be email addresses. Identity values are "<host>:<login>";
# logins cannot contain whitespace or `/`. always_visible values are valid
# path.Match globs. Keep the entire block absent to disable enforcement.

# Named repo sets for `context:<name>` search filters (T8.1). Patterns are
# path.Match globs on full repo names; `*` does not cross `/`. Names match
# [a-z0-9-]+ and every context needs at least one pattern.
contexts:
  backend:
    - "github.com/acme/api-*"

# Optional per-repository non-HEAD revisions (T10.4). HEAD is always indexed
# and is the default for unqualified searches. Each selector becomes a
# `rev:<selector>` scope and maps to one full branch/tag ref. At most seven
# entries are allowed per repo (eight total with HEAD); wildcards and short or
# ambiguous refs are rejected.
revisions: {}
# revisions:
#   github.com/acme/api:
#     release-1: refs/heads/release/1
#     v1.4.0: refs/tags/v1.4.0

# Optional service scope for a very large monorepository (Epic 30). The map key
# is the exact repository name and admits at most one active unit. Primary
# paths are required; supporting paths are optional exact declaration,
# generated-source, module/workspace, attribution, or typed-index inputs.
# Entries are clean UTF-8 repository-relative Git files or directories:
# absolute, traversal, backslash, duplicate, and ancestor-overlapping paths
# fail startup. A unit has at most 128 combined entries and 64 KiB of combined
# path bytes; its name is a 128-byte token using letters, digits, . _ or -.
#
# Configured repositories physically index only these paths at HEAD and every
# allowlisted revision. A selected path missing or special in any lane refuses
# the complete replacement; phebs never falls back to whole-repository input.
# A focused typed index is never inferred from repository-root `index.scip`.
# Designate one exact supporting file with kind `scip`; changing only this
# designation preserves the semantic unit digest but replaces the candidate
# generation and all dependent extraction. Without it, typed posture remains
# repository-root-unbound and focused code navigation/extractors report a gap.
analysis_units: {}
# analysis_units:
#   github.com/acme/monorepo:
#     name: payments
#     primary:
#       - services/payments/src
#     supporting:
#       - contracts/payment.proto
#       - services/payments/go.mod
#       - services/payments/index.scip
#     typed_index:
#       kind: scip
#       path: services/payments/index.scip

# Optional multi-service catalog input. The map key is the exact
# repository name and selects one normalized JSON file; phebs never scans a
# directory or invokes a build-system adapter to invent service authority.
# Both kinds require an absolute, clean, non-symlink regular file. A committed
# catalog declares its exact indexed HEAD in authority.version, so `version`
# is omitted here; its operator-supplied bytes are not verified against a Git
# blob. An operator catalog instead repeats the configured opaque version in
# its JSON. A selected replacement is published only after its
# complete regular-file census proves every path accepted or explicitly
# unowned; refusal preserves the prior authority. When no v2 entry exists, a
# committed analysis-unit-v1 state is imported side by side automatically;
# removing a v2 entry therefore makes that v1 import current on reconciliation.
# Each current catalog also reconciles independent service lifecycle rows;
# a catalog/state crash gap is unavailable until the exact retry repairs it.
# `runtime: v3` explicitly selects the segmented runtime only after its complete
# catalog, state, search, and relationship target is reconciled. Omission (or
# `runtime: v2`) preserves the v2 runtime; a dark v3 candidate never promotes
# itself. Provisional protobuf or Thrift extraction must be enabled so the
# required relationship target can be built. Once any durable selector exists,
# keep at least one of those packs enabled so reverse and holding repair remain
# live, including while the desired runtime is v2.
service_catalogs: {}
# service_catalogs:
#   github.com/acme/monorepo:
#     kind: operator # committed | operator
#     id: platform-catalog
#     version: "2026-08-04.1"
#     path: /etc/phebs/service-catalog.json
#     runtime: v3 # v2 | v3; omitted defaults to v2

# Optional signed pack-release selection (T48.2, operations in T48.4). Ships
# dark: an empty path admits no released pack and adds no pack work. `path` is a
# directory of signed PackRelease JSON records, verified once at the admitted
# startup boundary against `keys` (base64 ed25519 public keys). `path` must be
# absolute, clean and unpadded so it never resolves against the process working
# directory, and a non-empty `path` requires at least one key: without a trust
# anchor no record could ever be admitted, so that half-configured gate is
# refused while parsing rather than at startup. Only a record that verifies, is
# unexpired and applicable, and carries the released lifecycle status enters the
# ordinary/released admission set, and only when its pack identifier is bound to
# a fixed in-tree recipe; a verified released pack with no bound recipe refuses
# startup rather than loading unbound code. Toggling a provisional extraction
# switch below is never a path to this set, and there is no third-party or
# manifest-selected code loader. Every record must verify: a malformed or
# foreign-keyed record, a non-regular *.json entry, or two records naming one
# pack at the same release_version refuses startup. Per pack, the record with
# the highest release_version governs, so a later signed suspension withdraws an
# older release, and an expired governing record withdraws its pack; a
# superseded record's expiry has no effect.
#
# `artifacts_path` is the directory holding the card, manifest and validation
# artifacts the admitted records reference. It is censused once at the same
# startup boundary, it must be absolute, clean and unpadded, and a non-empty
# `path` requires it: the referenced-artifacts root and the resolver a record is
# checked against are derived from the bytes actually present, never asserted.
# A governing released record must also name this binary's own machine-derived
# implementation identity (source commit, executable digest, toolchain and
# in-tree pack-implementation digests); a record signed for another binary or
# another artifact set refuses startup rather than loading approximately. The
# field is inert while `path` is empty, so an artifact directory can be staged
# before its release records arrive.
#
# `revoked` is the operator's suspension and rollback control: it lists
# release_ids withdrawn out of band. Listing the record that governs its pack
# withdraws that pack, which is reported in one bounded startup log line rather
# than only appearing as an absent pack. Withdrawal never falls back to an older
# released record in the same directory, because a rollback is a newly signed
# record rather than a consequence of revoking a later one; revoking a
# superseded record therefore withdraws nothing and does not refuse the
# selection. Each entry must match a release_id's grammar and be unique. The
# list is inert while `path` is empty, so a revocation can be staged before the
# selection directory is configured.
release_selection:
  path: ""
  artifacts_path: ""
  keys: []
  revoked: []
# release_selection:
#   path: /etc/phebs/pack-releases
#   artifacts_path: /etc/phebs/pack-artifacts
#   keys:
#     - id: release-signer
#       public_key: "base64-ed25519-public-key"
#   revoked:
#     - "phebs.protobuf.contract/1.2.0"

# Sources of repos to sync (Epic 2). Names are required, unique, and match
# [a-z0-9-]+. Type is exactly github, gitlab, gitea, or git. HTTP(S) URLs must
# omit embedded credentials, query, and fragment. Code-host tokens are optional
# for public listings; uncomment their secret fields for private repositories.
# Opt-in managed SCIP installation. Omit unless a trusted offline installation
# has been provisioned and verified for this host and exact indexed HEAD.
# managed_scip:
#   manifest: /var/lib/phebs-scip-installation/installation.json
#   sha256: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

connections:
  # GitHub: at least one of orgs, users, repos unless app is configured.
  # GitHub forbids url/groups/http_auth/watch.
  - name: github-personal
    type: github
    token: ""
    # token: "${GITHUB_TOKEN}"
    users: [bmeddeb]
    orgs: []
    repos: [] # "owner/name"
    exclude:
      archived: true
      forks: false
      repos: ["*/*-mirror"] # glob on owner/name

  # GitHub as an App installation (T7.3) — higher rate limits, per-install
  # scoping. `app` and `token` are mutually exclusive; omit all selectors to
  # sync exactly the repos the installation was granted. Exactly one of
  # private_key_path or private_key is required. Paths are literal and do not
  # support ${ENV}; the inline private_key secret does.
  - name: github-app
    type: github
    app:
      id: 12345
      installation_id: 67890
      private_key_path: /etc/phebs/app.pem
      # private_key: "${APP_KEY_PEM}"

  # GitLab: at least one of groups, users, repos. URL defaults to
  # https://gitlab.com when empty. orgs/app/http_auth/watch are invalid.
  - name: gitlab-work
    type: gitlab
    url: https://git.example.com # omit for gitlab.com
    token: ""
    # token: "${GITLAB_TOKEN}"
    groups: [team/platform] # subgroups included
    users: []
    repos: [] # full project path
    exclude:
      archived: false
      forks: false
      repos: []

  # Gitea: HTTP(S) base URL and at least one of orgs/users/repos are required.
  # groups/app/http_auth/watch are invalid.
  - name: gitea-forge
    type: gitea
    url: https://gitea.example.com
    token: ""
    # token: "${GITEA_TOKEN}"
    orgs: [acme]
    users: []
    repos: []
    exclude:
      archived: false
      forks: false
      repos: []

  # A single repo over plain git protocol(s).
  - name: zoekt-mirror
    type: git
    url: https://github.com/sourcegraph/zoekt.git

  # Private HTTP Git uses transient Basic auth. Never put credentials,
  # query tokens, or fragments in url; those forms fail validation. http_auth
  # is valid only for generic HTTP(S) Git and requires both fields when enabled.
  - name: private-git
    type: git
    url: https://git.example.com/team/private.git
    http_auth:
      username: ""
      password: ""
      # username: "${GIT_HTTP_USERNAME}"
      # password: "${GIT_HTTP_PASSWORD}"

  # A local working repo with watch mode: commits (and branch switches)
  # become searchable within seconds. The index follows whatever branch is
  # checked out. A quoted ~/ path is portable across users and is named from
  # its home-relative suffix ("local/src/my-project"); no shell or wildcard
  # expansion occurs. Absolute and file:// paths retain their full-path names.
  # Pair with sync.poll_interval for snappier turnaround.
  - name: my-project
    type: git
    url: "~/src/my-project"
    watch: true
