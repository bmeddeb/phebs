# phebs configuration - exhaustive annotated reference (T1.1).
# phebs' own schema; not compatible with Sourcebot's config.json.
# This file passes strict config parsing as written. Connector URLs, selectors,
# paths, and identities are illustrative and must be replaced before use.
# Optional integrations use empty values, while commented examples show how to
# enable them. Unknown keys fail validation.
# ${ENV} expansion is supported only by documented secret fields; every
# referenced variable must exist and be non-empty.
# Secret-capable fields are auth.api_key, auth.bootstrap_user.password,
# auth.oidc.client_secret, webhook.secret, connections[].token,
# connections[].app.private_key, and connections[].http_auth username/password.

server:
  # Listen address. Default "127.0.0.1:3070". Expose phebs only through a
  # trusted TLS reverse proxy unless this is an isolated development host.
  addr: "127.0.0.1:3070"
  # All state lives here: shards at <data_dir>/index, bare repos at
  # <data_dir>/repos/<host>/<path>.git, supervised DB at <data_dir>/db
  # (including users, API-key hashes, and sessions).
  # Default "~/.phebs". `~` is expanded and the result must be an absolute,
  # literal path without glob metacharacters (*, ?, [, or backslash).
  data_dir: "~/.phebs"

auth:
  # Migration only: imports this legacy bearer as a SHA-256 hash into the
  # database. Sign in, create a named/revocable key under Settings, migrate
  # clients, then remove api_key; omission deletes the legacy DB key.
  api_key: ""
  # api_key: "${PHEBS_LEGACY_API_KEY}"

  # Session cookies are Secure by default. Keep true behind HTTPS. Set false
  # only for deliberate plain-HTTP local development such as localhost:3070.
  cookie_secure: true
  # Absolute session lifetime (default 12h, accepted range 15m..720h).
  # Sessions also have a fixed 30-minute idle timeout.
  session_lifetime: 12h

  # Optional CIDRs for every trusted reverse-proxy hop, including the direct
  # peer. Phebs then walks X-Forwarded-For for per-client login limits. Leave
  # empty when reached directly. Values must be exact CIDRs without surrounding
  # whitespace. Never configure client networks here.
  trusted_proxies: []
  # trusted_proxies: ["127.0.0.1/32", "10.0.0.10/32"]

  # Optional one-time first administrator. All-empty keeps it disabled. The
  # password is Argon2id-hashed and must be 12..1024 bytes when configured;
  # remove this block after first startup because changing it does not rotate
  # the stored password. Without bootstrap_user or OIDC, startup logs an
  # ephemeral setup token for the browser's first-run form.
  bootstrap_user:
    email: ""
    display_name: ""
    password: ""
    # email: admin@example.com
    # display_name: Phebs Admin
    # password: "${PHEBS_BOOTSTRAP_PASSWORD}"

  # Optional single OpenID Connect provider. All-empty keeps it disabled.
  # Discovery runs at startup; openid/profile/email are always requested,
  # with these additional scopes.
  # The provider must return a verified email. URLs must be absolute and omit
  # credentials, query, and fragment. HTTPS is required except for loopback
  # tests. Each extra scope is one non-whitespace token.
  oidc:
    issuer_url: ""
    client_id: ""
    client_secret: ""
    redirect_url: ""
    scopes: []
    # issuer_url: https://idp.example.com
    # client_id: phebs
    # client_secret: "${PHEBS_OIDC_CLIENT_SECRET}"
    # redirect_url: https://phebs.example.com/api/auth/oidc/callback
    # scopes: [groups]

sync:
  # Delete repo rows and mirrors that no connection claims (default off).
  cleanup_orphans: false
  # Job-runner poll cadence (Go duration, default 15s). Lower it when
  # watch mode should feel instant.
  poll_interval: 15s
  # Re-sync cadence for remote connections (T7.5). Default 1h; "0" disables.
  resync_interval: 1h

# Push webhooks (T7.4). Empty leaves POST /api/webhook disabled.
webhook:
  # Verifies X-Hub-Signature-256 payload signatures (GitHub and Gitea).
  secret: ""
  # secret: "${WEBHOOK_SECRET}"

# Audit log (T10.1). Recording is always on; retention prunes old events
# twice a day (default 2160h = 90 days, "0" keeps forever).
audit:
  retention: 2160h

# Local usage analytics (T10.2). Zero telemetry: events exist only in the
# local DB and feed #/analytics. Default 8760h = 365 days, "0" keeps forever.
analytics:
  retention: 8760h

# Immutable proof bundles are unbounded by default. Set a positive Go
# duration to expire them after their latest successful materialization.
# Bundle bytes/content IDs never include this lifecycle metadata.
proof_bundles:
  retention: "0"

# Validation-gated work. Keep disabled in production. The provisional proto
# reader has exact source provenance, but T11.1 is STOP/not established and it
# does not yet have canonical descriptor/module lineage (T12.3).
experimental:
  provisional_proto_extraction: false

# Permission-aware search (T10.3). PRESENCE of this block turns enforcement
# on: non-administrators then see only public repos, repos their mapped
# code-host identities grant, and always_visible matches — across search,
# file/history/code-nav reads, listings, and MCP. Identities are
# "<host>:<login>" where <host> is the repo-name prefix that host produces.
# ACLs mirror during sync (private repos only), so enable this, then re-sync.
# permissions:
#   users:
#     ben@meddeb.me: ["github.com:bmeddeb", "gitea.example.com:ben"]
#   always_visible: ["local/*"]  # repos with no ACL source (type git)
# User keys must be email addresses. Identity values are "<host>:<login>";
# logins cannot contain whitespace or `/`. always_visible values are valid
# path.Match globs. Keep the entire block absent to disable enforcement.

# Named repo sets for `context:<name>` search filters (T8.1). Patterns are
# path.Match globs on full repo names; `*` does not cross `/`. Names match
# [a-z0-9-]+ and every context needs at least one pattern.
contexts:
  backend:
    - "github.com/acme/api-*"

# Optional per-repository non-HEAD revisions (T10.4). HEAD is always indexed
# and is the default for unqualified searches. Each selector becomes a
# `rev:<selector>` scope and maps to one full branch/tag ref. At most seven
# entries are allowed per repo (eight total with HEAD); wildcards and short or
# ambiguous refs are rejected.
revisions: {}
# revisions:
#   github.com/acme/api:
#     release-1: refs/heads/release/1
#     v1.4.0: refs/tags/v1.4.0

# Sources of repos to sync (Epic 2). Names are required, unique, and match
# [a-z0-9-]+. Type is exactly github, gitlab, gitea, or git. HTTP(S) URLs must
# omit embedded credentials, query, and fragment. Code-host tokens are optional
# for public listings; uncomment their secret fields for private repositories.
connections:
  # GitHub: at least one of orgs, users, repos unless app is configured.
  # GitHub forbids url/groups/http_auth/watch.
  - name: github-personal
    type: github
    token: ""
    # token: "${GITHUB_TOKEN}"
    users: [bmeddeb]
    orgs: []
    repos: [] # "owner/name"
    exclude:
      archived: true
      forks: false
      repos: ["*/*-mirror"] # glob on owner/name

  # GitHub as an App installation (T7.3) — higher rate limits, per-install
  # scoping. `app` and `token` are mutually exclusive; omit all selectors to
  # sync exactly the repos the installation was granted. Exactly one of
  # private_key_path or private_key is required. Paths are literal and do not
  # support ${ENV}; the inline private_key secret does.
  - name: github-app
    type: github
    app:
      id: 12345
      installation_id: 67890
      private_key_path: /etc/phebs/app.pem
      # private_key: "${APP_KEY_PEM}"

  # GitLab: at least one of groups, users, repos. URL defaults to
  # https://gitlab.com when empty. orgs/app/http_auth/watch are invalid.
  - name: gitlab-work
    type: gitlab
    url: https://git.example.com # omit for gitlab.com
    token: ""
    # token: "${GITLAB_TOKEN}"
    groups: [team/platform] # subgroups included
    users: []
    repos: [] # full project path
    exclude:
      archived: false
      forks: false
      repos: []

  # Gitea: HTTP(S) base URL and at least one of orgs/users/repos are required.
  # groups/app/http_auth/watch are invalid.
  - name: gitea-forge
    type: gitea
    url: https://gitea.example.com
    token: ""
    # token: "${GITEA_TOKEN}"
    orgs: [acme]
    users: []
    repos: []
    exclude:
      archived: false
      forks: false
      repos: []

  # A single repo over plain git protocol(s).
  - name: zoekt-mirror
    type: git
    url: https://github.com/sourcegraph/zoekt.git

  # Private HTTP Git uses transient Basic auth. Never put credentials,
  # query tokens, or fragments in url; those forms fail validation. http_auth
  # is valid only for generic HTTP(S) Git and requires both fields when enabled.
  - name: private-git
    type: git
    url: https://git.example.com/team/private.git
    http_auth:
      username: ""
      password: ""
      # username: "${GIT_HTTP_USERNAME}"
      # password: "${GIT_HTTP_PASSWORD}"

  # A local working repo with watch mode: commits (and branch switches)
  # become searchable within seconds. The index follows whatever branch is
  # checked out. watch is valid only for generic Git with an absolute local or
  # file:// URL. Pair with sync.poll_interval for snappier turnaround.
  - name: my-project
    type: git
    url: /Users/ben/src/my-project
    watch: true
