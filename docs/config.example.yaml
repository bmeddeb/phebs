# phebs configuration — annotated reference (T1.1).
# phebs' own schema; not compatible with Sourcebot's config.json
# (an importer is planned, PORT_MAP §8).

server:
  # Listen address. Default ":3070".
  addr: ":3070"
  # All state lives here: shards at <data_dir>/index, bare repos at
  # <data_dir>/repos/<host>/<path>.git, embedded DB at <data_dir>/db.
  # Default "~/.phebs".
  data_dir: "~/.phebs"

auth:
  # Single bearer token for the API. Empty/omitted = open API
  # (serve logs a warning).
  api_key: "change-me"

sync:
  # Delete repo rows + mirrors no connection claims (default off).
  cleanup_orphans: false
  # Job-runner poll cadence (Go duration, default 15s). Lower it when
  # watch mode should feel instant.
  poll_interval: 15s
  # Re-sync cadence for remote connections (T7.5). Default 1h; "0" disables.
  resync_interval: 1h

# Push webhooks (T7.4): omit the whole block to leave POST /api/webhook off.
webhook:
  # Verifies X-Hub-Signature-256 payload signatures (GitHub and Gitea).
  secret: "${WEBHOOK_SECRET}"

# Named repo sets for `context:<name>` search filters (T8.1). Patterns are
# globs on full repo names; `*` does not cross `/`.
contexts:
  backend:
    - "github.com/acme/api-*"

# Sources of repos to sync (Epic 2). Names: lowercase [a-z0-9-], unique.
connections:
  # GitHub over PAT: at least one of orgs, users, repos.
  - name: github-personal
    type: github
    token: "${GITHUB_TOKEN}" # ${ENV} expanded — keep secrets out of this file
    users: [bmeddeb]
    orgs: []
    repos: [] # "owner/name"
    exclude:
      archived: true
      forks: false
      repos: ["*/*-mirror"] # glob on owner/name

  # GitHub as an App installation (T7.3) — higher rate limits, per-install
  # scoping. `app` and `token` are mutually exclusive; omit all selectors to
  # sync exactly the repos the installation was granted.
  - name: github-app
    type: github
    app:
      id: 12345
      installation_id: 67890
      private_key_path: /etc/phebs/app.pem # or private_key: "${APP_KEY_PEM}"

  # GitLab over PAT (T7.1): at least one of groups, users, repos.
  - name: gitlab-work
    type: gitlab
    url: https://git.example.com # omit for gitlab.com
    token: "${GITLAB_TOKEN}"
    groups: [team/platform] # subgroups included
    users: []
    repos: [] # full project path

  # Gitea over PAT (T7.2): base url required; orgs/users/repos.
  - name: gitea-forge
    type: gitea
    url: https://gitea.example.com
    token: "${GITEA_TOKEN}"
    orgs: [acme]

  # A single repo over plain git protocol(s).
  - name: zoekt-mirror
    type: git
    url: https://github.com/sourcegraph/zoekt.git

  # A local working repo with watch mode: commits (and branch switches)
  # become searchable within seconds. The index follows whatever branch is
  # checked out. Pair with sync.poll_interval for snappier turnaround.
  - name: my-project
    type: git
    url: /Users/ben/src/my-project
    watch: true
