<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    html, body { margin: 0; padding: 0; min-height: 100vh; }
    body { font-family: system-ui, "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; background: #FFFFFF; }
    a { color: #276EF1; }
    a:hover { color: #175BCC; }
    input::placeholder { color: #5E5E5E; opacity: 1; }
  </style>
</helmet>

<main data-screen-label="Login" style="min-height: 100vh; display: grid; place-items: center; padding: 24px; background-color: #FFFFFF; box-sizing: border-box;">
  <div style="width: 100%; max-width: 400px;">
    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 28px;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M21 8.5 V 7.5 A 4.5 4.5 0 0 0 16.5 3 H 7.5 A 4.5 4.5 0 0 0 3 7.5 V 16.5 A 4.5 4.5 0 0 0 7.5 21 H 16.5 A 4.5 4.5 0 0 0 21 16.5 V 15.5" stroke="#000000" stroke-width="1.8" stroke-linecap="round"></path><path d="M23.5 12 H 18.5" stroke="#A6A6A6" stroke-width="0.9" stroke-dasharray="1.8 1.6"></path><circle cx="15.5" cy="12" r="1.9" fill="#276EF1"></circle></svg><span style="font-size: 28px; line-height: 34px; font-weight: 700; color: #000000;">phebs</span></div>
    <h1 style="font-size: 20px; line-height: 28px; font-weight: 600; color: #000000; margin-top: 0; margin-bottom: 20px;">Sign in</h1>
    <form style="display: grid; gap: 14px;" onSubmit="{{ noopSubmit }}">
      <div style="display: flex; align-items: center; height: 48px; border-radius: 8px; border: 2px solid #F3F3F3; background-color: #F3F3F3; box-sizing: border-box;">
        <input value="{{ email }}" onChange="{{ onEmail }}" type="email" autoComplete="username" placeholder="Email" aria-label="Email" style="flex: 1; min-width: 0; background: transparent; border: none; outline: none; font-family: inherit; font-size: 16px; line-height: 24px; color: #000000; padding: 0 14px;"></input>
      </div>
      <div style="display: flex; align-items: center; height: 48px; border-radius: 8px; border: 2px solid #F3F3F3; background-color: #F3F3F3; box-sizing: border-box;">
        <input value="{{ password }}" onChange="{{ onPassword }}" type="password" autoComplete="current-password" placeholder="Password" aria-label="Password" style="flex: 1; min-width: 0; background: transparent; border: none; outline: none; font-family: inherit; font-size: 16px; line-height: 24px; color: #000000; padding: 0 14px;"></input>
      </div>
      <button type="submit" style="height: 48px; border-radius: 8px; border: none; background-color: #000000; color: #FFFFFF; font-family: inherit; font-size: 16px; line-height: 20px; font-weight: 500; padding: 0 16px; cursor: pointer;" style-hover="background-color: #333333;">Sign in</button>
      <button type="button" style="height: 48px; border-radius: 8px; border: none; background-color: #F3F3F3; color: #000000; font-family: inherit; font-size: 16px; line-height: 20px; font-weight: 500; padding: 0 16px; cursor: pointer;" style-hover="background-color: #DDDDDD;">Continue with SSO</button>
    </form>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { email: '', password: '' };
  renderVals() {
    return {
      email: this.state.email,
      password: this.state.password,
      onEmail: (e) => this.setState({ email: e.currentTarget.value }),
      onPassword: (e) => this.setState({ password: e.currentTarget.value }),
      noopSubmit: (e) => e.preventDefault(),
    };
  }
}
</script>
</body>
</html>
