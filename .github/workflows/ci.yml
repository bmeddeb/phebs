name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Go static and compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum
      - name: Install pinned golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version-file: .golangci-lint-version
          install-only: true
      - name: Verify exact tools and run static gate
        run: make ci-static

  go-test:
    name: Go full test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum
      - name: Install pinned SurrealDB
        run: sh scripts/install-surreal-ci.sh "$RUNNER_TEMP"
      - name: Run full Go suite
        run: make ci-go

  race:
    name: Go concurrency race
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum
      - name: Install pinned SurrealDB
        run: sh scripts/install-surreal-ci.sh "$RUNNER_TEMP"
      - name: Run concurrency-sensitive race suite
        run: make ci-race

  ui:
    name: UI test, lint, and embedded build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum
      - name: Run UI and embedded-build gate
        run: make ci-ui

  release:
    name: Release bundle and fresh-data smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/package-lock.json
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum
      - name: Install pinned SurrealDB
        run: sh scripts/install-surreal-ci.sh "$RUNNER_TEMP"
      - name: Build twice, compare, smoke, and package
        run: |
          set -euo pipefail
          first="$RUNNER_TEMP/release-a"
          second="$RUNNER_TEMP/release-b"
          bundle="phebs-v0.1.0-linux-amd64"
          make release VERSION=v0.1.0 RELEASE_ROOT="$first"
          make release VERSION=v0.1.0 RELEASE_ROOT="$second"
          cmp "$first/$bundle/release-manifest.json" "$second/$bundle/release-manifest.json"
          make smoke-release VERSION=v0.1.0 RELEASE_BUNDLE="$first/$bundle"
          mkdir -p dist/release
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -C "$first" -cf - "$bundle" |
            gzip -n > "dist/release/$bundle.tar.gz"
          sha256sum "dist/release/$bundle.tar.gz" > "dist/release/$bundle.tar.gz.sha256"
      - name: Retain verified release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phebs-v0.1.0-linux-amd64
          path: |
            dist/release/phebs-v0.1.0-linux-amd64.tar.gz
            dist/release/phebs-v0.1.0-linux-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
