# phebs config for real-world feature/UX testing against the mobilityCorp
# monorepo simulator (~/corpora/mobility-sim, generated by mobility-sim-gen).
#
# Run from the phebs repo:
#   ./phebs serve -config phebs.mobility-sim.yaml
#
# Isolated data dir, plain-HTTP localhost dev, watch mode on the corpus, and
# every provisional evidence surface enabled so the corpus exercises Contract
# Atlas, Caller Map, Impact/Workbench, Thrift field evidence, and Kafka
# topic evidence against realistic code.

server:
  addr: "127.0.0.1:3070"
  # Separate data dir keeps corpus testing out of any primary phebs state.
  data_dir: "~/.phebs-mobility-sim"

auth:
  # Local plain-HTTP development on localhost.
  cookie_secure: false

sync:
  # Snappy watch-mode turnaround: commits to the corpus become searchable
  # within seconds.
  poll_interval: 5s

# See the zoekt-git-index child output during the first full ingest.
indexing:
  verbose: true

# Bounded pipeline receipts for the surfaces under test.
diagnostics:
  jobs: true
  candidates: true
  extraction: true
  extractor_details: true

# Validation-gated evidence surfaces — this corpus is the real-world workout
# for exactly these. Workbench requires proto or thrift extraction (both on).
# Thrift-field extraction expects a committed root index.scip the corpus does
# not have; its honest gap reporting is part of the test.
experimental:
  provisional_proto_extraction: true
  provisional_thrift_extraction: true
  provisional_thrift_field_extraction: true
  provisional_kafka_extraction: true
  provisional_workbench: true

# Whole-repository indexing: no analysis_units, no service_catalogs. The
# corpus is the neutral whole-monorepo shape.

# context:mobility search filter for the corpus. The local ~/ path is named
# from its home-relative suffix: local/corpora/mobility-sim.
contexts:
  mobility:
    - "local/corpora/mobility-sim"

connections:
  # Local corpus repo with watch mode: commits and branch switches are
  # picked up within poll_interval.
  - name: mobility-sim
    type: git
    url: "~/corpora/mobility-sim"
    watch: true
